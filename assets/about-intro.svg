<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="mxabout-t mxabout-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="mxabout-t">About Mayank Sharma</title><desc id="mxabout-d">Computer Science undergraduate at NIET Greater Noida, CGPA 8.5/10, graduating 2028, building full-stack and AI systems.</desc>
<defs>
<linearGradient id="mxabout-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".6" stop-color="#190B12"/><stop offset="1" stop-color="#2B0D1C"/></linearGradient>
<linearGradient id="mxabout-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".75" stop-color="#E5B5C7"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/></linearGradient>
<linearGradient id="mxabout-tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
<pattern id="mxabout-gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity=".08"/></pattern>
<filter id="mxabout-gl" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.sweep{animation:mxabout-sw 6s linear infinite}
.pulse{animation:mxabout-pu 4s ease-in-out infinite}
.tw{animation:mxabout-tw 3.5s ease-in-out infinite}
@keyframes mxabout-sw{from{stroke-dasharray:140 860;stroke-dashoffset:140}to{stroke-dasharray:140 860;stroke-dashoffset:-1000}}
@keyframes mxabout-pu{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes mxabout-tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}.pulse,.tw{animation:none}}
</style>
<rect width="1200" height="250" rx="16" fill="url(#mxabout-bg)"/>
<rect width="1200" height="250" rx="16" fill="url(#mxabout-gr)"/>
<rect x="1" y="1" width="1198" height="248" rx="15" fill="none" stroke="#701A3D" stroke-opacity=".6"/>
<text x="48" y="64" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#F8F0F3" fill-opacity=".94">I&#x27;m a Computer Science undergraduate who builds production-style</text><text x="48" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#F8F0F3" fill-opacity=".94">full-stack and AI systems. I care about the unglamorous parts that</text><text x="48" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#F8F0F3" fill-opacity=".94">make software trustworthy: authentication, database-level analytics,</text><text x="48" y="166" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#F8F0F3" fill-opacity=".94">automated testing, CI/CD, and AI output that is checked against</text><text x="48" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#F8F0F3" fill-opacity=".94">source data instead of taken on faith.</text><line x1="760" y1="30" x2="760" y2="220" stroke="#701A3D" stroke-width="1.5"/><text x="800" y="56" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3" fill="#C77B9B">PROGRAMME</text><text x="800" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F8F0F3">B.Tech, Computer Science &amp; Engineering</text><text x="800" y="108" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3" fill="#C77B9B">INSTITUTE</text><text x="800" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F8F0F3">NIET, Greater Noida</text><text x="800" y="160" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3" fill="#C77B9B">GRADUATING</text><text x="800" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F8F0F3">2028</text><text x="800" y="212" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3" fill="#C77B9B">CGPA</text><text x="800" y="234" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F8F0F3">8.5 / 10</text><line class="pulse" x1="48" y1="224" x2="520" y2="224" stroke="#C77B9B" stroke-width="6" stroke-linecap="round" filter="url(#mxabout-gl)" opacity=".6"/><line x1="48" y1="224" x2="520" y2="224" stroke="url(#mxabout-ln)" stroke-width="2" stroke-linecap="round"/><line class="sweep" pathLength="1000" x1="48" y1="224" x2="520" y2="224" stroke="#F8F0F3" stroke-width="2" stroke-linecap="round"/>
</svg>
