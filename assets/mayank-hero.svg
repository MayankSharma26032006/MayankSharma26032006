<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="mxh-title mxh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mxh-title">Mayank Sharma — Full-stack and AI systems</title>
  <desc id="mxh-desc">Animated burgundy banner for Mayank Sharma, Computer Science undergraduate building full-stack and AI systems.</desc>

  <defs>
    <linearGradient id="mxh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#2B0D1C"/>
    </linearGradient>
    <radialGradient id="mxh-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mxh-halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#451126" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mxh-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="mxh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#C77B9B"/>
      <stop offset="0.7" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mxh-trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="mxh-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="mxh-fade" cx="0.62" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="mxh-gridmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
      <rect width="1200" height="420" fill="url(#mxh-fade)"/>
    </mask>
    <filter id="mxh-blur" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="mxh-soft" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="mxh-clip"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>

  <style>
    .mxh-drift-a { animation: mxh-drift-a 14s ease-in-out infinite; }
    .mxh-drift-b { animation: mxh-drift-b 18s ease-in-out infinite; }
    .mxh-run     { animation: mxh-run 7s linear infinite; }
    .mxh-shine   { animation: mxh-shine 5s linear infinite; }
    .mxh-pulse   { animation: mxh-pulse 4s ease-in-out infinite; }
    .mxh-spin    { animation: mxh-spin 90s linear infinite; transform-origin: 0 0; }
    .mxh-sat-static { display: none; }
    @keyframes mxh-drift-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px,24px); } }
    @keyframes mxh-drift-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px,-18px); } }
    @keyframes mxh-run   { from { stroke-dasharray: 130 870; stroke-dashoffset: 130; } to { stroke-dasharray: 130 870; stroke-dashoffset: -1000; } }
    @keyframes mxh-shine { from { stroke-dasharray: 80 920; stroke-dashoffset: 80; } to { stroke-dasharray: 80 920; stroke-dashoffset: -1000; } }
    @keyframes mxh-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.95; } }
    @keyframes mxh-spin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mxh-drift-a, .mxh-drift-b, .mxh-run, .mxh-shine, .mxh-pulse, .mxh-spin { animation: none; }
      .mxh-sat-live { display: none; }
      .mxh-sat-static { display: inline; }
    }
  </style>

  <g clip-path="url(#mxh-clip)">
    <!-- base -->
    <rect width="1200" height="420" fill="url(#mxh-bg)"/>

    <!-- drifting gradient light -->
    <circle class="mxh-drift-a" cx="960" cy="200" r="300" fill="url(#mxh-halo)"/>
    <circle class="mxh-drift-b" cx="220" cy="380" r="260" fill="url(#mxh-halo2)"/>

    <!-- technical grid -->
    <rect width="1200" height="420" fill="url(#mxh-grid)" mask="url(#mxh-gridmask)"/>

    <!-- editorial frame -->
    <rect x="14" y="14" width="1172" height="392" rx="10" fill="none" stroke="#701A3D" stroke-opacity="0.55"/>
    <g stroke="#C77B9B" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M34 62V34H62"/><path d="M1166 62V34H1138"/>
      <path d="M34 358V386H62"/><path d="M1166 358V386H1138"/>
    </g>

    <!-- orbital geometry -->
    <g transform="translate(960 200)">
      <g class="mxh-spin">
        <circle r="120" fill="none" stroke="#C77B9B" stroke-opacity="0.22" stroke-dasharray="2 8"/>
        <path d="M0 -128V-112M0 128V112M-128 0H-112M128 0H112" stroke="#E5B5C7" stroke-opacity="0.5"/>
      </g>
      <circle r="70" fill="none" stroke="#C77B9B" stroke-opacity="0.35"/>
      <g transform="rotate(-22)">
        <ellipse rx="190" ry="66" fill="none" stroke="#C77B9B" stroke-opacity="0.45"/>
        <path id="mxh-orbit" d="M-190 0 a190 66 0 1 0 380 0 a190 66 0 1 0 -380 0" fill="none"/>
        <g class="mxh-sat-live">
          <circle r="9" fill="#E5B5C7" opacity="0.55" filter="url(#mxh-soft)">
            <animateMotion dur="16s" repeatCount="indefinite"><mpath href="#mxh-orbit"/></animateMotion>
          </circle>
          <circle r="4" fill="#F8F0F3">
            <animateMotion dur="16s" repeatCount="indefinite"><mpath href="#mxh-orbit"/></animateMotion>
          </circle>
        </g>
        <g class="mxh-sat-static"><circle cx="150" cy="-40" r="4" fill="#F8F0F3"/></g>
      </g>
      <g transform="rotate(28)">
        <ellipse rx="150" ry="48" fill="none" stroke="#C77B9B" stroke-opacity="0.22"/>
      </g>
      <circle r="16" fill="#701A3D" fill-opacity="0.5" filter="url(#mxh-soft)"/>
      <circle r="5" fill="#C77B9B"/>
    </g>

    <!-- eyebrow -->
    <text x="80" y="150" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="4" fill="#C77B9B">B.TECH CSE  ·  NIET  ·  CLASS OF 2028</text>

    <!-- name -->
    <text x="80" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="url(#mxh-name)" textLength="640" lengthAdjust="spacing">MAYANK SHARMA</text>

    <!-- role -->
    <text x="82" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#E5B5C7">Full-stack &amp; AI systems builder</text>
    <text x="82" y="304" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#C77B9B" fill-opacity="0.9">JWT AUTH  ·  MONGODB PIPELINES  ·  CI/CD  ·  LLM-ASSISTED RECONCILIATION</text>

    <!-- glowing underline -->
    <g>
      <line class="mxh-pulse" x1="80" y1="332" x2="720" y2="332" stroke="#C77B9B" stroke-width="6" stroke-linecap="round" filter="url(#mxh-blur)" opacity="0.7"/>
      <line x1="80" y1="332" x2="720" y2="332" stroke="url(#mxh-line)" stroke-width="2" stroke-linecap="round"/>
      <line class="mxh-shine" x1="80" y1="332" x2="720" y2="332" pathLength="1000" stroke="#F8F0F3" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
    </g>

    <!-- animated trace path -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 376 C 240 376, 260 356, 400 356 S 620 394, 760 374 S 980 344, 1120 366" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.5"/>
      <path class="mxh-run" pathLength="1000" d="M80 376 C 240 376, 260 356, 400 356 S 620 394, 760 374 S 980 344, 1120 366" stroke="url(#mxh-trace)" stroke-width="2.5"/>
    </g>
    <g fill="#10070C" stroke="#C77B9B" stroke-width="1.5">
      <circle cx="80" cy="376" r="4"/><circle cx="400" cy="356" r="4"/>
      <circle cx="760" cy="374" r="4"/><circle cx="1120" cy="366" r="4"/>
    </g>
  </g>
</svg>
