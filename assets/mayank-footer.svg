<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="mxf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mxf-title">Mayank Sharma — footer</title>
  <defs>
    <linearGradient id="mxf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="mxf-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="mxf-glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <style>
    .mxf-run { animation: mxf-run 8s linear infinite; }
    @keyframes mxf-run { from { stroke-dasharray: 220 780; stroke-dashoffset: 220; } to { stroke-dasharray: 220 780; stroke-dashoffset: -1000; } }
    @media (prefers-reduced-motion: reduce) { .mxf-run { animation: none; } }
  </style>
  <rect width="1200" height="110" rx="14" fill="url(#mxf-bg)"/>
  <rect x="8" y="8" width="1184" height="94" rx="9" fill="none" stroke="#451126"/>
  <path d="M60 46 C 220 26, 340 66, 500 46 S 800 26, 960 46 S 1100 56, 1140 46" fill="none" stroke="url(#mxf-wave)" stroke-opacity="0.45" stroke-width="1.5"/>
  <path class="mxf-run" pathLength="1000" d="M60 46 C 220 26, 340 66, 500 46 S 800 26, 960 46 S 1100 56, 1140 46" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" filter="url(#mxf-glow)"/>
  <text x="600" y="84" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="4" fill="#C77B9B">MAYANK SHARMA  ·  BUILT WITH CARE</text>
