<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="mxfin-t mxfin-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="mxfin-t">Finverity</title><desc id="mxfin-d">Finverity: an LLM-assisted financial reconciliation engine matching 591 cases with 100% classification accuracy and a 96.1% fully automated clean rate, with 64 regression tests and a SHA-256 audit trail.</desc>
<defs>
<linearGradient id="mxfin-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".6" stop-color="#190B12"/><stop offset="1" stop-color="#2B0D1C"/></linearGradient>
<linearGradient id="mxfin-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".75" stop-color="#E5B5C7"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/></linearGradient>
<linearGradient id="mxfin-tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
<pattern id="mxfin-gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity=".08"/></pattern>
<filter id="mxfin-gl" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.sweep{animation:mxfin-sw 6s linear infinite}
.pulse{animation:mxfin-pu 4s ease-in-out infinite}
.tw{animation:mxfin-tw 3.5s ease-in-out infinite}
@keyframes mxfin-sw{from{stroke-dasharray:140 860;stroke-dashoffset:140}to{stroke-dasharray:140 860;stroke-dashoffset:-1000}}
@keyframes mxfin-pu{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes mxfin-tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}.pulse,.tw{animation:none}}
</style>
<rect width="1200" height="340" rx="16" fill="url(#mxfin-bg)"/>
<rect width="1200" height="340" rx="16" fill="url(#mxfin-gr)"/>
<rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#701A3D" stroke-opacity=".6"/>
<text x="48" y="54" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="4" fill="#C77B9B">AI  ·  FINANCIAL RECONCILIATION</text><text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="url(#mxfin-tx)">Finverity</text><line class="pulse" x1="48" y1="126" x2="300" y2="126" stroke="#C77B9B" stroke-width="6" stroke-linecap="round" filter="url(#mxfin-gl)" opacity=".6"/><line x1="48" y1="126" x2="300" y2="126" stroke="url(#mxfin-ln)" stroke-width="2" stroke-linecap="round"/><line class="sweep" pathLength="1000" x1="48" y1="126" x2="300" y2="126" stroke="#F8F0F3" stroke-width="2" stroke-linecap="round"/><text x="48" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">Agent-assisted reconciliation engine built for Razorpay&#x27;s</text><text x="48" y="188" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">AI Finance Controller buildathon. Every LLM explanation</text><text x="48" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">is fact-checked against source data and fails closed on</text><text x="48" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">unverifiable figures: narrate, don&#x27;t decide.</text><rect x="48" y="262" width="68" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="82.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Python</text><rect x="124" y="262" width="128" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="188.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Groq API (LLM)</text><rect x="260" y="262" width="90" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="305.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Streamlit</text><rect x="358" y="262" width="120" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="418.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">python-dotenv</text><rect x="48" y="298" width="165" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="130.5" y="316.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">SHA-256 audit trail</text><rect x="700" y="40" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="720" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxfin-tx)">591</text><text x="720" y="124" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >cases matched</text><text x="720" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >500 orders, 91 settlements</text><rect x="926" y="40" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="946" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxfin-tx)">100%</text><text x="946" y="124" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >classification accuracy</text><text x="946" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >against ground truth</text><rect x="700" y="180" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="720" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxfin-tx)">96.1%</text><text x="720" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >fully automated clean</text><text x="720" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >reconciliation rate</text><rect x="926" y="180" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="946" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxfin-tx)">64</text><text x="946" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >passing regression tests</text><text x="946" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >SHA-256 chain of custody</text>
</svg>
