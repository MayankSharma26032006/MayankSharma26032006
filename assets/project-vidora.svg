<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="mxvid-t mxvid-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="mxvid-t">Vidora</title><desc id="mxvid-d">Vidora: a full-stack video platform with community feed, JWT access/refresh token rotation, MongoDB aggregation analytics, CI/CD with GitHub Actions (14+ workflow runs), deployed on Vercel and Render with MongoDB Atlas.</desc>
<defs>
<linearGradient id="mxvid-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".6" stop-color="#190B12"/><stop offset="1" stop-color="#2B0D1C"/></linearGradient>
<linearGradient id="mxvid-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".75" stop-color="#E5B5C7"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/></linearGradient>
<linearGradient id="mxvid-tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
<pattern id="mxvid-gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity=".08"/></pattern>
<filter id="mxvid-gl" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.sweep{animation:mxvid-sw 6s linear infinite}
.pulse{animation:mxvid-pu 4s ease-in-out infinite}
.tw{animation:mxvid-tw 3.5s ease-in-out infinite}
@keyframes mxvid-sw{from{stroke-dasharray:140 860;stroke-dashoffset:140}to{stroke-dasharray:140 860;stroke-dashoffset:-1000}}
@keyframes mxvid-pu{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes mxvid-tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}.pulse,.tw{animation:none}}
</style>
<rect width="1200" height="340" rx="16" fill="url(#mxvid-bg)"/>
<rect width="1200" height="340" rx="16" fill="url(#mxvid-gr)"/>
<rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#701A3D" stroke-opacity=".6"/>
<text x="48" y="54" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="4" fill="#C77B9B">FULL-STACK  ·  MEDIA PLATFORM</text><text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="url(#mxvid-tx)">Vidora</text><line class="pulse" x1="48" y1="126" x2="300" y2="126" stroke="#C77B9B" stroke-width="6" stroke-linecap="round" filter="url(#mxvid-gl)" opacity=".6"/><line x1="48" y1="126" x2="300" y2="126" stroke="url(#mxvid-ln)" stroke-width="2" stroke-linecap="round"/><line class="sweep" pathLength="1000" x1="48" y1="126" x2="300" y2="126" stroke="#F8F0F3" stroke-width="2" stroke-linecap="round"/><text x="48" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">Video hosting with a built-in community feed: creators</text><text x="48" y="188" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">publish videos and posts, subscribe, like, comment and</text><text x="48" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">organize playlists. MongoDB aggregation pipelines power</text><text x="48" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F8F0F3" fill-opacity=".92">the creator dashboard; GitHub Actions tests every push.</text><rect x="48" y="262" width="83" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="89.5" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">React.js</text><rect x="139" y="262" width="76" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="177.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Node.js</text><rect x="223" y="262" width="98" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="272.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Express.js</text><rect x="329" y="262" width="76" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="367.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">MongoDB</text><rect x="413" y="262" width="98" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="462.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Cloudinary</text><rect x="519" y="262" width="46" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="542.0" y="280.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">JWT</text><rect x="48" y="298" width="113" height="28" rx="14" fill="#451126" fill-opacity=".55" stroke="#701A3D"/><text x="104.5" y="316.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#E5B5C7">Tailwind CSS</text><rect x="700" y="40" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="720" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxvid-tx)">JWT</text><text x="720" y="124" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >access / refresh</text><text x="720" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >token rotation</text><rect x="926" y="40" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="946" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxvid-tx)">14+</text><text x="946" y="124" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >CI workflow runs</text><text x="946" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >on GitHub Actions</text><rect x="700" y="180" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="720" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxvid-tx)">Live</text><text x="720" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >Vercel, Render</text><text x="720" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >and MongoDB Atlas</text><rect x="926" y="180" width="212" height="124" rx="12" fill="#190B12" stroke="#451126"/><text x="946" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#mxvid-tx)">DB-level</text><text x="946" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >analytics via</text><text x="946" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E5B5C7" >aggregation pipelines</text>
</svg>
